name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (gofmt, vet, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Canonical Go checks from AGENTS.md and CONTRIBUTING.md.
      - name: gofmt -l .
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: go vet ./...
        run: go vet ./...
      - name: go test ./... -count=1
        run: go test ./... -count=1

  c:
    name: c runtime strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Canonical C check from AGENTS.md and CONTRIBUTING.md.
      - name: gcc -fsyntax-only runtime/c/alder.c
        run: gcc -std=c11 -Wall -Wextra -Werror -pedantic -Wshadow -Wconversion -fsyntax-only runtime/c/alder.c

  bootstrap:
    name: source bootstrap
    runs-on: ubuntu-latest
    # bootstrap/regenerate.sh builds the committed C bootstrap at -O2 and then
    # runs the self-hosted compiler over the 30-source root, which needs about
    # 3.5 GiB and takes about 3 minutes. It only has to run when
    # something it validates changes, so gate it on the touched paths instead
    # of putting it on every pull request's critical path.
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether the source bootstrap is affected
        id: affected
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo run=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A push compares against the commit it replaced; a pull request
          # compares against its base branch. Comparing a push to main against
          # origin/main would always see no changes, because they are the same
          # commit. Default to running it when the comparison cannot be made,
          # so a shallow-clone or new-branch edge case fails safe instead of
          # silently skipping the gate. regenerate.sh consumes bootstrap/,
          # compiler/src/ and runtime/c/ only.
          if [ "${{ github.event_name }}" = pull_request ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] ||
             ! git fetch --no-tags --depth=1 origin "$base" ||
             ! changed=$(git diff --name-only "$base" HEAD); then
            echo run=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -qE '^(bootstrap/|compiler/src/|runtime/c/)'; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo run=false >> "$GITHUB_OUTPUT"
          fi
      - name: cc --version
        if: steps.affected.outputs.run == 'true'
        run: cc --version
      - name: bootstrap/regenerate.sh
        if: steps.affected.outputs.run == 'true'
        run: ./bootstrap/regenerate.sh
