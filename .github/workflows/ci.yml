name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Pull requests share one group per ref, so a newer push to the PR cancels
  # the older run. Pushes to main get one group per commit and are never
  # cancelled or replaced while pending: the bootstrap job compares each push
  # only against its own parent, so a dropped run would leave that push's
  # bootstrap changes unchecked.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  go:
    name: go (gofmt, vet, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install comma-decimal locale for formatting tests
        run: |
          sudo apt-get update
          sudo apt-get install -y locales
          sudo localedef -i de_DE -f UTF-8 de_DE.UTF-8
      # Canonical Go checks from AGENTS.md and CONTRIBUTING.md.
      - name: gofmt -l .
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: go vet ./...
        run: go vet ./...
      - name: go test ./... -count=1
        run: go test ./... -count=1

  c:
    name: c runtime strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Canonical C check from AGENTS.md and CONTRIBUTING.md.
      - name: gcc -fsyntax-only runtime/c/alder.c
        run: gcc -std=c11 -Wall -Wextra -Werror -pedantic -Wshadow -Wconversion -ffp-contract=off -fsyntax-only runtime/c/alder.c

  bind-probe-aarch64:
    name: bind probe (Linux AArch64)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install AArch64 cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Cross-compile the bind probe
        env:
          ALDER_BIND_CC: aarch64-linux-gnu-gcc
        run: go test ./compiler -run '^TestAlderBindProbeCrossTarget$' -count=1 -v

  bind-probe-windows:
    name: bind probe (Windows LLP64)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install MinGW-w64 cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Cross-compile the bind probe
        env:
          ALDER_BIND_CC: x86_64-w64-mingw32-gcc
        run: go test ./compiler -run '^TestAlderBindProbeCrossTarget$' -count=1 -v

  bootstrap:
    name: source bootstrap
    runs-on: ubuntu-latest
    # bootstrap/regenerate.sh builds the committed C bootstrap at -O2 and then
    # runs the self-hosted compiler over the 30-source root, which needs about
    # 3.5 GiB and takes about 3 minutes. It only has to run when
    # something it validates changes, so gate it on the touched paths instead
    # of putting it on every pull request's critical path. The timeout is
    # several times the usual run, so a compiler performance regression
    # fails here instead of silently stretching every run.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether the source bootstrap is affected
        id: affected
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo run=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A push compares against the commit it replaced; a pull request
          # compares against its base branch. Comparing a push to main against
          # origin/main would always see no changes, because they are the same
          # commit. Default to running it when the comparison cannot be made,
          # so a shallow-clone or new-branch edge case fails safe instead of
          # silently skipping the gate. regenerate.sh consumes bootstrap/,
          # compiler/src/ and runtime/c/ only.
          if [ "${{ github.event_name }}" = pull_request ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] ||
             ! git fetch --no-tags --depth=1 origin "$base" ||
             ! changed=$(git diff --name-only "$base" HEAD); then
            echo run=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -qE '^(bootstrap/|compiler/src/|runtime/c/)'; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo run=false >> "$GITHUB_OUTPUT"
          fi
      - name: cc --version
        if: steps.affected.outputs.run == 'true'
        run: cc --version
      - name: bootstrap/regenerate.sh
        if: steps.affected.outputs.run == 'true'
        run: ./bootstrap/regenerate.sh
